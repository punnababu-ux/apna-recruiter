<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" preserveAspectRatio="xMaxYMin meet"><style>
.cloud{transform-box:view-box;animation:breathe 7s ease-in-out infinite alternate}
.speck{transform-box:fill-box;animation:float 6s ease-in-out infinite}
@keyframes breathe{from{transform:scale(.94)}to{transform:scale(1.08)}}
@keyframes float{0%{transform:translateY(4px);opacity:0}25%{opacity:.95}100%{transform:translateY(-22px);opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.speck{animation:none}.speck{opacity:.8}}
.flow{animation:flow 1.2s linear infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 3.2s ease-in-out infinite alternate}
.bob{transform-box:fill-box;animation:bob 4s ease-in-out infinite alternate}
.pich{transform-box:fill-box;transform-origin:right center;animation:pump 2.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes puff{from{transform:scale(.9)}to{transform:scale(1.1)}}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
@keyframes pump{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.flow,.puff,.bob,.pich{animation:none}}
.flow{animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}.sway{transform-box:fill-box;transform-origin:top center;animation:sway 4.8s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}.splat{transform-box:fill-box;transform-origin:center;animation:splat 2.8s ease-in-out infinite alternate}@keyframes splat{from{transform:scale(.92)}to{transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.flow,.sway,.splat{animation:none}}</style><defs><linearGradient id="py" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBDD8A"/><stop offset=".55" stop-color="#F2C14E"/><stop offset="1" stop-color="#D9A630"/></linearGradient><linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8D3F3"/><stop offset="1" stop-color="#5E9FD6"/></linearGradient><radialGradient id="ball" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter></defs><g filter="url(#b)" opacity=".8"><circle cx="360" cy="0" r="70" fill="#FFE29A"/><circle cx="250" cy="-10" r="50" fill="#F4C4D2"/></g><g class="sway" style="animation-delay:-0s"><line x1="268" y1="0" x2="268" y2="8" stroke="#4E3A52" stroke-opacity=".35" stroke-width="1.5"/><path d="M265 10 L271 10 L268 5Z" fill="#F4A9BE"/><ellipse cx="268" cy="21.0" rx="10" ry="11.5" fill="#F4A9BE"/><ellipse cx="268" cy="21.0" rx="10" ry="11.5" fill="url(#ball)"/></g><g class="sway" style="animation-delay:-1.6s"><line x1="302" y1="0" x2="302" y2="18" stroke="#4E3A52" stroke-opacity=".35" stroke-width="1.5"/><path d="M299 20 L305 20 L302 15Z" fill="#9DE2C9"/><ellipse cx="302" cy="29.9" rx="9" ry="10.35" fill="#9DE2C9"/><ellipse cx="302" cy="29.9" rx="9" ry="10.35" fill="url(#ball)"/></g><g class="sway" style="animation-delay:-3.1s"><line x1="336" y1="0" x2="336" y2="18" stroke="#4E3A52" stroke-opacity=".35" stroke-width="1.5"/><path d="M333 20 L339 20 L336 15Z" fill="#7DB9E8"/><ellipse cx="336" cy="31.0" rx="10" ry="11.5" fill="#7DB9E8"/><ellipse cx="336" cy="31.0" rx="10" ry="11.5" fill="url(#ball)"/></g></svg>