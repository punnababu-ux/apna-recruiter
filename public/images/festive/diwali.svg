<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMin slice"><style>
.sway{transform-box:view-box;animation:sway 4.8s ease-in-out infinite alternate}
.glow{animation:glow 2.6s ease-in-out infinite alternate}
.spark{animation:twinkle 2.2s ease-in-out infinite}
.bulb{animation:bulb 3s ease-in-out infinite alternate}
@keyframes bulb{from{opacity:.1}to{opacity:.45}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes glow{from{opacity:.25}to{opacity:.6}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sway,.glow,.spark,.bulb{animation:none}}
